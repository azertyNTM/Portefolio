  <title id="title">Lysere</title>
  <desc id="desc">Logo horizontal Lysere, composé du symbole L avec étoile et du nom Lysere.</desc>
  <metadata><lysere:brand xmlns:lysere="https://lysere.local/brand" source="lysere-logo-master.svg" geometry-sha256="932d49dc28478a64bc48a390017ee32f60430b274f4efa2a28d3ebe623be38fb"><lysere:note>Horizontal presentation variant. Original path data is unchanged.</lysere:note></lysere:brand></metadata>
  <defs>
    <linearGradient id="gradVertical" x1="430" y1="650" x2="555" y2="145" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#07172f"/><stop offset="0.52" stop-color="#1b49c8"/><stop offset="1" stop-color="#34bdf2"/></linearGradient>
    <linearGradient id="gradFold" x1="430" y1="650" x2="540" y2="725" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0d2b59"/><stop offset="1" stop-color="#278ce8"/></linearGradient>
    <linearGradient id="gradBase" x1="455" y1="700" x2="790" y2="610" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#081a36"/><stop offset="1" stop-color="#172b4d"/></linearGradient>
    <linearGradient id="gradSpark" x1="575" y1="490" x2="650" y2="575" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3fb6ff"/><stop offset="1" stop-color="#2769ff"/></linearGradient>
    <style>
      #mark-vertical { transform-box: fill-box; transform-origin: bottom; animation: unfold-vertical .72s cubic-bezier(.2,.75,.2,1) both; }
      #mark-fold { transform-box: fill-box; transform-origin: left center; animation: unfold-fold .42s .42s cubic-bezier(.2,.75,.2,1) both; }
      #mark-base { transform-box: fill-box; transform-origin: left center; animation: unfold-base .5s .52s cubic-bezier(.2,.75,.2,1) both; }
      #mark-spark { transform-box: fill-box; transform-origin: center; animation: reveal-spark .36s .88s cubic-bezier(.2,.75,.2,1) both; }
      #wordmark { animation: reveal-wordmark .45s .68s ease-out both; }
      @keyframes unfold-vertical { from { opacity: 0; transform: scaleY(.12); } to { opacity: 1; transform: scaleY(1); } }
      @keyframes unfold-fold { from { opacity: 0; transform: scaleX(.15); } to { opacity: 1; transform: scaleX(1); } }
      @keyframes unfold-base { from { opacity: 0; transform: scaleX(.05); } to { opacity: 1; transform: scaleX(1); } }
      @keyframes reveal-spark { from { opacity: 0; transform: scale(.25) rotate(-18deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes reveal-wordmark { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
      @media (prefers-reduced-motion: reduce) { #mark-vertical, #mark-fold, #mark-base, #mark-spark, #wordmark { animation: none; } }
    </style>
  </defs>

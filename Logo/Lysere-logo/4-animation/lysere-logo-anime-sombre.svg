<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.0 -103.5 353.5 157.5" width="1414" height="630" role="img" aria-label="Lysere"><title>Lysere — logo animé</title><style>
/* Animation « L'aiguillage » — joue une fois (~2,2 s) puis reste figée. */
#mark-y path{stroke-dasharray:1 2}
#y-stem{animation:draw .55s cubic-bezier(.6,0,.3,1) both}
#y-left,#y-right{animation:draw .45s cubic-bezier(.3,0,.2,1) .5s both}
#y-route{animation:draw .3s cubic-bezier(.2,.8,.2,1) .95s both}
.lt{animation:fade .5s ease-out both}
.lt0{animation-delay:1.15s;--dx:8px}
.lt1{animation-delay:1.25s;--dx:-8px}.lt2{animation-delay:1.31s;--dx:-8px}.lt3{animation-delay:1.37s;--dx:-8px}.lt4{animation-delay:1.43s;--dx:-8px}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:translateX(var(--dx))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
